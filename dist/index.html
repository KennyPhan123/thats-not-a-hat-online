<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>That's Not a Hat!</title>
    <meta name="description" content="Game bài online - That's Not a Hat. Chơi cùng 2-8 người!">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-D7qLBG5I.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BXrtDe8Q.css">
</head>

<body>
    <!-- Theme Toggle -->
    <button id="themeToggleBtn" class="theme-toggle-btn" title="Giao diện Tối/Sáng">
        <span class="theme-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        </span>
    </button>
    
    <!-- Mic Toggle -->
    <button id="micToggleBtn" class="mic-toggle-btn hidden" title="Bật/Tắt Micro">
        <span class="mic-icon">
            <!-- Mic Off Icon (Default) -->
            <svg id="micOffIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            <!-- Mic On Icon (Hidden initially) -->
            <svg id="micOnIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </span>
    </button>

    <!-- Lobby Screen -->
    <div id="lobby" class="screen active">
        <a href="https://github.com/KennyPhan123/thats-not-a-hat-online" target="_blank" style="position: absolute; top: 15px; right: 15px; z-index: 1000; color: inherit; text-decoration: none;" title="GitHub">
    <svg height="32" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="32" data-view-component="true" style="fill: currentColor;">
        <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.46-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
    </svg>
</a>
        <div class="lobby-container">
            <h1 class="game-title">That's Not a Hat!</h1>
            <div class="author-credits" style="font-size: 0.9em; opacity: 0.8; margin-top: -10px; margin-bottom: 15px;">Một dự án của Nguyên Khang (KennyPhan)</div>

            <!-- Main Menu - Create or Join -->
            <div id="mainMenu" class="lobby-section">
                <div class="menu-buttons">
                    <button id="showCreate" class="btn btn-primary btn-large">Tạo Phòng</button>
                    <button id="showJoin" class="btn btn-secondary btn-large">Vào Phòng</button>
                </div>
            </div>

            <!-- Create Game Form -->
            <div id="createForm" class="lobby-section hidden">
                <div class="form-card">
                    <h3>Tạo Phòng Mới</h3>
                    <div class="input-group">
                        <label for="createName">Tên của bạn</label>
                        <input type="text" id="createName" placeholder="Nhập tên" maxlength="12"
                            autocomplete="off">
                    </div>
                    <button id="createRoom" class="btn btn-primary">Tạo Phòng</button>
                    <button class="btn-link" id="backFromCreate">← Quay lại</button>
                </div>
            </div>

            <!-- Join Game Form -->
            <div id="joinForm" class="lobby-section hidden">
                <div class="form-card">
                    <h3>Vào Phòng Có Sẵn</h3>
                    <div class="input-group">
                        <label for="joinName">Tên của bạn</label>
                        <input type="text" id="joinName" placeholder="Nhập tên" maxlength="12"
                            autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="roomCode">Mã phòng (4 ký tự)</label>
                        <input type="text" id="roomCode" placeholder="ABCD" maxlength="4" autocomplete="off"
                            class="code-input">
                    </div>
                    <button id="joinRoom" class="btn btn-secondary">Vào Phòng</button>
                    <button class="btn-link" id="backFromJoin">← Quay lại</button>
                </div>
            </div>

            <!-- Room Info (after create/join) -->
            <div id="roomInfo" class="room-info hidden">
                <div class="code-display">
                    <p class="code-label">Mã Phòng</p>
                    <div id="displayRoomCode" class="room-code-box"></div>
                    <button id="copyCodeBtn" class="btn-copy">Nhấn để sao chép</button>
                </div>
                <div class="players-section">
                    <p>Người chơi: <span id="playerCount">0</span>/8</p>
                    <div id="playerList" class="player-list"></div>
                </div>
                <div id="hardModeToggle" class="hard-mode-toggle hidden">
                    <label class="toggle-label">
                        <input type="checkbox" id="hardModeCheckbox">
                        <span class="toggle-text">Chế độ khó (3 ô)</span>
                    </label>
                </div>
                <div id="timerSetting" class="timer-setting hidden">
                    <label class="toggle-label">
                        <span class="toggle-text">Hẹn giờ (s):</span>
                        <select id="timerDurationSelect" class="timer-select">
                            <option value="0">Tắt</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                            <option value="45">45</option>
                            <option value="60">60</option>
                            <option value="90">90</option>
                            <option value="120">120</option>
                            <option value="180">180</option>
                        </select>
                    </label>
                </div>
                <button id="startGame" class="btn btn-primary hidden">Bắt Đầu</button>
                <p class="waiting-text">Đang chờ chủ phòng...</p>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game" class="screen">
        <div id="gameTable" class="game-table">
            <!-- Deck in center -->
            <div id="deck" class="deck">
                <div class="deck-cards"></div>
                <span class="deck-count">110</span>
            </div>

            <!-- Player slots will be added dynamically -->
            <div id="playersContainer" class="players-container"></div>

            <!-- Penalty zone -->
            <div id="penaltyZone" class="penalty-zone">
                <span class="penalty-text">Bỏ bài</span>
            </div>

            <!-- Fullscreen button -->
            <button id="fullscreenBtn" class="fullscreen-btn" title="Toàn màn hình">
                <span class="fullscreen-icon">[ ]</span>
            </button>

            <!-- Vignette Overlay for Penalty -->
            <div id="vignetteOverlay" class="vignette-overlay"></div>
        </div>

        <!-- Game Over Modal -->
        <div id="gameOverModal" class="modal hidden">
            <div class="modal-content">
                <h2>Kết Thúc!</h2>
                <p id="gameOverMessage"></p>
                <button id="playAgain" class="btn btn-primary">Chơi Lại</button>
            </div>
        </div>
    </div>

</body>

</html>
